<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Check Primavera P6 .xer schedule files for broken rows, missing links, negative float and high float. Runs in your browser." />
    <title>XER Checker</title>
    <script>
      // Apply the theme before the first paint, so a dark-mode visit doesn't flash white.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('xer-checker-theme');
        } catch (e) {}
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
